name: bazar_suez
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # أيقونات iOS
  cupertino_icons: ^1.0.2

  # 🔥 مكتبات Firebase (متوافقة مع بعض - بدون تعارض)
  firebase_core: ^4.2.0
  cloud_firestore: ^6.0.3
  cloud_functions: ^6.0.4
  firebase_auth: ^6.1.1
  firebase_storage: ^13.0.3
  firebase_messaging: ^16.1.0
  firebase_database: ^12.0.3

  # 🔔 إشعارات محلية وتشغيل صوت التنبيه
  flutter_local_notifications: ^18.0.1
  audioplayers: ^6.1.0

  # 🌐 مكتبات التوجيه وإدارة الحالة
  go_router: ^16.2.5
  provider: ^6.1.5

  # 🔐 تسجيل الدخول الاجتماعي
  google_sign_in: ^6.1.5
  flutter_facebook_auth: ^7.1.2

  # 🎨 واجهة المستخدم والتحسينات
  font_awesome_flutter: ^10.2.0
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^1.2.1
  flutter_custom_clippers: ^2.0.0

  # 📱 صلاحيات وصور ومشاركة
  permission_handler: ^12.0.1
  image_picker: ^1.0.8
  share_plus: ^12.0.1
  url_launcher: ^6.3.0

  # 🌍 الخرائط والموقع الجغرافي
  google_maps_flutter: ^2.9.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # ⚙️ أدوات مساعدة
  uuid: ^4.5.1
  http: ^1.1.0
  hive_flutter: ^1.1.0
  google_places_flutter: ^2.1.1
  fl_chart: ^1.1.1

  
  # 💳 بوابة الدفع
  webview_flutter: ^4.9.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.5
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/egypt.jpg
    - assets/images/food_placeholder.png
    - assets/images/logo.png
    - assets/images/categories/
    - assets/images/Onboarding Screens/one.png
    - assets/images/Onboarding Screens/two.png
    - assets/images/Onboarding Screens/three.png
    - assets/images/create_market.png
    - assets/images/adsmarket.jpg
    - assets/images/busy.png
    - assets/images/closed.png
    - assets/images/appbar.png
    - assets/sounds/notification.mp3
    - assets/images/404.png
    - assets/images/no_internet.png

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700